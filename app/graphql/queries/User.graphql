query User($userId: ID!) {
  User(id: $userId) {
    _id
    email
    name
    groups {
      id
      name
    }
    roles {
      id
      name
    }
    banned
    avatar
    settings
    created_date
    updated_date
    info {
      addresses
      birthday_date
      emails
      fullname
      id
      phones
      post
      user_id
    }
    service
  }
}
