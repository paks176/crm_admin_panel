query AllUsers ($page: Int, $perPage: Int, $filter: UserFilter) {
  allUsers (page: $page, perPage: $perPage, filter: $filter) {
    id
    name
    email
    banned
    groups {
      id
      name
    }
    roles {
      id
      name
    }
    created_date
    updated_date
    avatar
    info {
      addresses
      birthday_date
      emails
      fullname
      id
      phones
      post
      user_id
    }
  }
}
