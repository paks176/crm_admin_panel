mutation changeGroups(
  $userIdsToBind: [ID!]!,
  $userIdsToUnbind: [ID!]!,
  $objectsToBind: [ID!],
  $objectsToUnbind: [ID!],
  $runBind: Boolean!
  $runUnbind: Boolean!
) {

  bindGroups(userIds: $userIdsToBind, groupIds: $objectsToBind) @include(if: $runBind) {
    id
    roles {
      id
    }
  }

  unbindGroups(userIds: $userIdsToUnbind, groupIds: $objectsToUnbind) @include(if: $runUnbind) {
    id
    roles {
      id
    }
  }
}
