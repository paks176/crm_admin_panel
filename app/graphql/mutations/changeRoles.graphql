mutation changeRoles(
  $userIdsToBind: [ID!]!,
  $userIdsToUnbind: [ID!]!,
  $objectsToBind: [ID!],
  $objectsToUnbind: [ID!],
  $runBind: Boolean!
  $runUnbind: Boolean!
) {

  bindRoles(userIds: $userIdsToBind, roleIds: $objectsToBind) @include(if: $runBind) {
    id
    roles {
      id
    }
  }

  unbindRoles(userIds: $userIdsToUnbind, roleIds: $objectsToUnbind) @include(if: $runUnbind) {
    id
    roles {
      id
    }
  }
}
